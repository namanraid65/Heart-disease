    early stopping.
  model_family: 1D_AlexNet
  training_type: local
  feature_setting: homogeneous_25
  federated_strategy: null
  privacy_setting: none
  latent_dimension: null
  num_rounds: 0
  local_epochs: 100
  batch_size: 16
  learning_rate: 0.001
  seed: 42
  client_count: 3
  client_ids:
  - hospital_1
  - hospital_2
  - hospital_3
